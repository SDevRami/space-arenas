<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Space Arenas — Loading</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0b0e14;font-family:ui-monospace,monospace;color:#dfe6f2}
#loading-screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
h1{font-size:28px;color:#7cd4ff;margin:0 0 8px;letter-spacing:2px}
p{font-size:13px;color:#8fa3c8;margin:0 0 24px}
.loader{width:40px;height:40px;border:3px solid #2c3a5e;border-top-color:#7cd4ff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="loading-screen">
  <h1>SPACE ARENAS</h1>
  <p>Building game&hellip;</p>
  <div class="loader"></div>
</div>
<script>
(function(){
  var tries=0;
  var iv=setInterval(function(){
    tries++;
    document.querySelector('p').textContent='Building game\u2026 ('+tries+'s)';
    fetch('/index.html').then(function(r){return r.text()}).then(function(t){
      if(t.indexOf('id="app"')!==-1){clearInterval(iv);location.reload()}
    })["catch"](function(){});
  },1000);
})();
</script>
</body>
</html>
