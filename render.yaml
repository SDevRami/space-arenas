# Render Blueprint for the online server (the online/ service inside the game repo).
# rootDir: online makes Render build/start inside that subfolder only.
services:
  - type: web
    name: space-arenas-online
    runtime: node
    plan: free
    rootDir: online
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/status
    autoDeploy: true
    envVars:
      - key: SA_MODE
        value: online
      - key: SA_PORT
        value: 17321
      - key: SA_PASSPHRASE
        sync: false
      - key: SA_PUBLIC_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SA_ENABLE_PUBLISHING
        sync: false
      - key: SA_TESTERS
        sync: false
      - key: SA_TESTER_EMAILS
        sync: false
      - key: SA_FORBIDDEN_USERNAME
        sync: false
      - key: SA_FORBIDDEN_USERNAME_EMAILS
        sync: false
      - key: SA_MATCHES_MAX_ROWS
        sync: false
      - key: SA_ADMIN_PASSWORD
        sync: false
      - key: SA_RATE_ADMIN_LOGIN_PER_MIN
        sync: false
      - key: SA_RATE_ADMIN_STATS_PER_MIN
        sync: false