<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Space Arenas — Map Builder</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #0b0e14; font-family: ui-monospace, monospace; color: #dfe6f2; }
      #app { position: relative; width: 100%; height: 100%; }
      #canvas { position: absolute; inset: 0; }
      #panel { position: absolute; right: 0; top: 0; width: 240px; background: rgba(8,10,16,0.85); border-left: 1px solid #26304a; height: 100%; padding: 12px; overflow-y: auto; font-size: 12px; }
      #panel h3 { color: #7cd4ff; margin-bottom: 8px; }
      #panel label { display: block; margin: 8px 0 2px; color: #8fa3c8; }
      #panel input, #panel select { width: 100%; background: #0b0e14; border: 1px solid #2c3a5e; color: #dfe6f2; padding: 6px; font-family: inherit; }
      #panel button { margin-top: 10px; width: 100%; padding: 8px; background: #1e5fa8; color: white; border: none; cursor: pointer; font-family: inherit; }
      #panel button.secondary { background: #274a36; }
      #panel .row { display: flex; gap: 6px; }
      #panel .row input { width: 50%; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="canvas"></div>
      <div id="panel">
        <h3>Map Builder (v0)</h3>
        <label>Map name</label>
        <input id="map-name" value="Custom Map" />
        <label>Size</label>
        <div class="row">
          <input id="size-w" type="number" value="128" />
          <input id="size-h" type="number" value="128" />
        </div>
        <label>Brush: terrain</label>
        <select id="brush">
          <option value="0">Ground</option>
          <option value="2">Water</option>
          <option value="1">Cliff</option>
          <option value="4">Buildable Ground</option>
        </select>
        <label>Tool</label>
        <select id="tool">
          <option value="terrain">Paint terrain</option>
          <option value="obstruction">Place static object</option>
          <option value="supply">Place supply field</option>
          <option value="spawn">Place spawn</option>
        </select>
        <label>Static object kind</label>
        <select id="object-kind">
          <option value="tree">Tree (vehicles crush it)</option>
          <option value="rock">Rock (blocks, shootable)</option>
          <option value="wreck">Wreck (indestructible)</option>
        </select>
        <label>Day / night light (−10 dark … +10 light)</label>
        <input id="light" type="range" min="-10" max="10" step="1" value="0" />
        <label>Status</label>
        <div id="status" style="color:#8fa3c8; min-height: 40px;">Ready.</div>
        <button id="save-idb">Save to library</button>
        <button id="export-btn">Export .sa-map.json</button>
        <button class="secondary" id="new-map">New map</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
